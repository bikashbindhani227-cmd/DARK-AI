<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" role="img" aria-labelledby="title desc">
  <title id="title">DARK AI</title>
  <desc id="desc">Animated DARK AI wordmark</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#ff4d6d"/>
      <stop offset="100%" stop-color="#8b0018"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-40%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="12" y="12" width="696" height="156" rx="42" fill="#09050d" stroke="#8b0018" stroke-width="4"/>
  <circle cx="92" cy="90" r="38" fill="none" stroke="#ff4d6d" stroke-width="5" opacity=".9">
    <animate attributeName="r" values="30;46;30" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".9;.2;.9" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <path d="M68 92 84 108 118 70" fill="none" stroke="url(#g)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <text x="150" y="112" font-family="Inter,Arial,sans-serif" font-size="72" font-weight="800" letter-spacing="7" fill="url(#g)" filter="url(#glow)">DARK AI</text>
  <rect x="148" y="130" width="280" height="4" rx="2" fill="#8b0018">
    <animate attributeName="width" values="90;280;160;280;90" dur="3.5s" repeatCount="indefinite"/>
  </rect>
</svg>
